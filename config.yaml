# DecodeHub/config.yaml
# Project-wide configuration. Commit this file with sensible defaults.
#
# Path priority (highest → lowest):
#   1. Environment variable  DECODEHUB_<KEY>   (e.g. DECODEHUB_OUTPUT=/mnt/fast/out)
#   2. Value in this file
#   3. Built-in default (relative to project root)
#
# Relative paths are resolved from the project root (where this file lives).
# Use absolute paths for scratch / shared-filesystem locations.
#
# API keys must be set as environment variables — never put real keys here.
#   export COHERE_API_KEY=...
#   export GEMINI_API_KEY=...

paths:
  # HuggingFace model + dataset cache (equivalent to HF_HOME).
  hf_cache: "~/.cache/huggingface"

  # Where precomputed artifacts live (kNN-LM datastores, token graphs).
  # Repo-relative by default; point this at fast scratch storage for large runs.
  output: "output"

  # Raw / processed data files (biography JSON, precisewiki JSONL, triplets …).
  data: "data"

  # Generation result JSONs written by run scripts.
  results: "./results"

  # Evaluation result JSONLs written by eval scripts.
  eval_results: "./evaluation_results"

  # Absolute path to the raw PreciseWiki JSONL used by pre_load_precisewiki.
  # Leave empty ("") if you do not use PreciseWiki pre-processing.
  precisewiki_raw: ""

# Short model aliases → HuggingFace repo IDs.
# Pass the alias as --base_model; the full path is resolved automatically.
# You can also pass a full HuggingFace repo ID or a local path directly.
