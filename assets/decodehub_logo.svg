<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 210" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="ghEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- transparent background -->

  <!-- mark: retrieval from a compact grounding space shaping the decoded token -->
  <g transform="translate(50,32)">
    <!-- compact reference grounding space -->
    <g fill="#3f8f5f" opacity="0.4">
      <circle cx="8"  cy="28" r="6"/>
      <circle cx="26" cy="8"  r="5"/>
      <circle cx="6"  cy="64" r="5"/>
      <circle cx="30" cy="46" r="6"/>
      <circle cx="14" cy="98" r="5"/>
      <circle cx="34" cy="86" r="4"/>
    </g>
    <!-- retrieval edges aggregating into the decoding node -->
    <g stroke="#15803d" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.35">
      <line x1="8"  y1="28" x2="96" y2="64"/>
      <line x1="26" y1="8"  x2="96" y2="64"/>
      <line x1="6"  y1="64" x2="96" y2="64"/>
      <line x1="30" y1="46" x2="96" y2="64"/>
      <line x1="14" y1="98" x2="96" y2="64"/>
      <line x1="34" y1="86" x2="96" y2="64"/>
    </g>
    <!-- candidate next-token edges -->
    <g stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.35">
      <line x1="96" y1="64" x2="156" y2="26"/>
      <line x1="96" y1="64" x2="150" y2="104"/>
    </g>
    <!-- highlighted grounded decoding path -->
    <path d="M96,64 L156,26"
          fill="none" stroke="url(#ghEdge)" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- aggregation / decoding node -->
    <circle cx="96"  cy="64"  r="16" fill="url(#ghEdge)"/>
    <!-- selected (grounded) token -->
    <circle cx="156" cy="26"  r="14" fill="url(#ghEdge)"/>
    <!-- suppressed alternative token -->
    <circle cx="150" cy="104" r="11" fill="#fff" stroke="#3f8f5f" stroke-width="4.5"/>
  </g>

  <!-- wordmark -->
  <text x="252" y="92"  font-size="44" font-weight="800" fill="#14532d" letter-spacing="0.5">DecodeHub</text>
  <text x="254" y="128" font-size="27" font-weight="800" fill="#15803d" letter-spacing="4">RAD</text>
  <text x="254" y="156" font-size="12" font-weight="600" fill="#3f8f5f" letter-spacing="1">RETRIEVAL-AUGMENTED DECODING</text>
</svg>
